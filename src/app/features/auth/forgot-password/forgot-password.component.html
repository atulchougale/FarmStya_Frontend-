<main class="register-wrapper">

    <section class="container py-5">

        <div class="row justify-content-center">

            <div class="col-12 col-md-10 col-lg-6 col-xl-5">

                <div class="card border shadow-lg rounded-4">

                    <div class="card-body p-4 p-md-5">

                        <h1 class="display-6 fw-bold mb-2">
                            Forgot Password
                        </h1>

                        <p class="text-muted mb-4">
                            Enter your registered email address and we'll send you a password reset link.
                        </p>

                        <form [formGroup]="forgotPasswordForm" (ngSubmit)="onSubmit()" autocomplete="off">

                            <!-- Email -->

                            <div class="mb-4">

                                <label for="email" class="form-label fw-semibold">

                                    Email Address

                                </label>

                                <input id="email" type="email" class="form-control custom-input"
                                    placeholder="Enter registered email" formControlName="email">

                                @if(
                                f['email'].touched &&
                                f['email'].errors?.['required']
                                )
                                {
                                <small class="text-danger">
                                    Email is required
                                </small>
                                }

                                @if(
                                f['email'].touched &&
                                f['email'].errors?.['email']
                                )
                                {
                                <small class="text-danger">
                                    Please enter a valid email address
                                </small>
                                }

                            </div>

                            <!-- Button -->

                            <button type="submit" class="btn btn-register btn-lg w-100" [disabled]="forgotPasswordForm.invalid || isSubmitting">

                                @if(isSubmitting)
                                {
                                <span class="spinner-border spinner-border-sm me-2">
                                </span>

                                Sending...
                                }
                                @else
                                {
                                Send Reset Link
                                }

                            </button>

                            <!-- Back To Login -->

                            <div class="text-center mt-4">

                                <a routerLink="/login" class="text-decoration-none auth-link">

                                    Back To Login

                                </a>

                            </div>

                        </form>

                    </div>

                </div>

            </div>

        </div>

    </section>

</main>
