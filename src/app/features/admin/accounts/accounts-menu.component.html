<main class="accounts-page accounts-menu-page">
 <header class="page-header"><div><h1><i class="bi bi-wallet2 admin-page-icon" aria-hidden="true"></i>{{ 'Accounts / Finance' | t }}</h1><p>{{ 'Choose a task. Lists, forms and reports open on separate pages.' | t }}</p></div><a class="btn btn-outline-primary" routerLink="/admin/accounts/overview"><i class="bi bi-speedometer2" aria-hidden="true"></i>{{ 'Accounts Overview' | t }}</a></header>
 <p *ngIf="loading" class="account-loading" role="status">{{ 'Loading accounting data…' | t }}</p>
 <p *ngIf="error" class="alert alert-danger" role="alert">{{ error | t }}</p>
 <ng-container *ngIf="!loading && !error"><section *ngFor="let group of groups;let index=index" class="account-menu-section" [attr.aria-labelledby]="'account-group-'+index"><header><span class="account-menu-number" aria-hidden="true">{{ index+1 }}</span><div><h2 [id]="'account-group-'+index">{{ group.title | t }}</h2><p>{{ group.description | t }}</p></div></header><div class="account-menu-grid"><ng-container *ngFor="let item of group.items"><a *ngIf="visible(item)" [routerLink]="'/admin/accounts/'+item.path" [queryParams]="item.type?{type:item.type}:{}" class="account-menu-card"><i class="bi" [ngClass]="item.icon" aria-hidden="true"></i><span>{{ item.label | t }}</span><i class="bi bi-arrow-right" aria-hidden="true"></i></a></ng-container></div></section></ng-container>
</main>
